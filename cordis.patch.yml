# whisper (且听鲸吟) bundle patch: register this package in the Web browser
# roster. client-modules scans host Loader entries for dsh.client.platform:
# "web" declarations and composes them into window.__DSH_BOOT__; the browser
# half then loads /plugins/whisper/client.js. The actual TurnStatus
# enhancement is applied by the node half (lib/index.js) at mount time.
- insert:
    - id: whisper
      name: 'whisper'
